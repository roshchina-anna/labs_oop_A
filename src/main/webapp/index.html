<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аутентификация</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #111827;
            --accent: #38bdf8;
            --text: #e5e7eb;
            --muted: #94a3b8;
            --error: #f87171;
            --success: #34d399;
        }

        body {
            margin: 0;
            font-family: "Inter", system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.12), transparent 25%),
                        radial-gradient(circle at 90% 10%, rgba(109, 40, 217, 0.12), transparent 25%),
                        var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        header {
            padding: 32px 20px 10px;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: 28px;
            letter-spacing: 0.5px;
        }

        h1 span {
            color: var(--accent);
        }

        p.subtitle {
            color: var(--muted);
            margin-top: 6px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 18px;
            padding: 10px 20px 40px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .card {
            background: linear-gradient(160deg, rgba(56, 189, 248, 0.12), rgba(17, 24, 39, 0.95));
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 18px;
            padding: 18px 20px 20px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(6px);
        }

        .card h2 {
            margin: 0 0 12px;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card h2::before {
            content: "";
            width: 8px;
            height: 24px;
            background: linear-gradient(180deg, var(--accent), rgba(56, 189, 248, 0.4));
            border-radius: 999px;
        }

        label {
            display: block;
            font-size: 13px;
            color: var(--muted);
            margin: 10px 0 6px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(148, 163, 184, 0.5);
            background: rgba(15, 23, 42, 0.6);
            color: var(--text);
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        button {
            margin-top: 14px;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            color: #0b1223;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3);
        }

        button.secondary {
            background: rgba(148, 163, 184, 0.2);
            color: var(--text);
            border: 1px solid rgba(148, 163, 184, 0.5);
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: var(--accent);
            font-weight: 600;
            font-size: 13px;
        }

        .status {
            margin-top: 12px;
            padding: 12px 14px;
            border-radius: 12px;
            background: rgba(17, 24, 39, 0.75);
            border: 1px solid rgba(148, 163, 184, 0.35);
            color: var(--text);
            line-height: 1.5;
            white-space: pre-line;
        }

        .status.success {
            border-color: rgba(52, 211, 153, 0.6);
            color: var(--success);
        }

        .status.error {
            border-color: rgba(248, 113, 113, 0.6);
            color: var(--error);
        }

        .token-box {
            margin-top: 10px;
            padding: 10px 12px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px dashed rgba(56, 189, 248, 0.5);
            border-radius: 10px;
            color: var(--text);
            word-break: break-all;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            font-size: 12px;
        }

        ul {
            padding-left: 18px;
            margin: 6px 0;
            color: var(--muted);
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .actions button {
            flex: 1 1 140px;
        }
    </style>
</head>
<body>
<div id="app">
    <header>
        <p class="subtitle">Регистрация/авторизация</p>
    </header>

    <div class="grid">
        <div class="card">
            <h2>Регистрация</h2>
            <label for="reg-username">Имя пользователя</label>
            <input id="reg-username" v-model="registerForm.username" placeholder="Введите логин">
            <label for="reg-password">Пароль</label>
            <input id="reg-password" type="password" v-model="registerForm.password" placeholder="Введите пароль">
            <button @click="register">Создать аккаунт</button>
        </div>

        <div class="card">
            <h2>Авторизация</h2>
            <label for="login-username">Имя пользователя</label>
            <input id="login-username" v-model="loginForm.username" placeholder="Введите логин">
            <label for="login-password">Пароль</label>
            <input id="login-password" type="password" v-model="loginForm.password" placeholder="Введите пароль">
            <button @click="login">Войти</button>
        </div>
    </div>
</div>
<script>
    const { createApp } = Vue;

    createApp({
        data() {
            return {
                registerForm: { username: '', password: '' },
                loginForm: { username: '', password: '' },
                token: localStorage.getItem('jwt_token') || '',
                user: null,
                status: { message: '', type: '' }
            };
        },
        methods: {
            async register() {
                this.clearStatus();
                try {
                    const response = await fetch('/api/auth/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(this.registerForm)
                    });
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || 'Ошибка регистрации');
                    this.status = { message: 'Пользователь успешно создан. Теперь авторизуйтесь.', type: 'success' };
                    this.registerForm = { username: '', password: '' };
                } catch (err) {
                    this.status = { message: err.message, type: 'error' };
                }
            },
            async login() {
                this.clearStatus();
                try {
                    const response = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(this.loginForm)
                    });
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || 'Не удалось войти');
                    this.token = data.token;
                    localStorage.setItem('jwt_token', data.token);
                    this.user = data.user;
                    this.status = { message: 'Авторизация прошла успешно.', type: 'success' };
                } catch (err) {
                    this.status = { message: err.message, type: 'error' };
                }
            },
            async fetchProfile() {
                this.clearStatus();
                if (!this.token) {
                    this.status = { message: 'Сначала авторизуйтесь.', type: 'error' };
                    return;
                }
                try {
                    const response = await fetch('/api/users/me', {
                        headers: { 'Authorization': `Bearer ${this.token}` }
                    });
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || 'Не удалось получить профиль');
                    this.user = data;
                    this.status = { message: 'Данные пользователя получены.', type: 'success' };
                } catch (err) {
                    this.status = { message: err.message, type: 'error' };
                }
            },
            logout() {
                this.token = '';
                this.user = null;
                localStorage.removeItem('jwt_token');
                this.status = { message: 'Вы вышли из аккаунта.', type: 'success' };
            },
            clearStatus() {
                this.status = { message: '', type: '' };
            }
        },
        mounted() {
            if (this.token) {
                this.fetchProfile();
            }
        }
    }).mount('#app');
</script>
</body>
</html>
